# スタッフアプリ(mobile/)の iPhone・Android アプリを作る。
# - Android: インストールできる APK を作り、このワークフローの「Artifacts」から staff-app-android をダウンロードできる
# - iOS: シミュレーター用にビルドして、壊れていないか確かめる(実機・App Store 用は署名が必要。mobile/README.md を参照)
name: スタッフアプリ(スマホ)

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      # Android の通知には Firebase の設定ファイルが要る。GitHub の Secrets に GOOGLE_SERVICES_JSON があれば使う
      - name: 通知の設定(Firebase)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            # 通知が使えるアプリだと画面に知らせる(User-Agent の印)
            node -e "const f='capacitor.config.json';const c=require('./'+f);c.appendUserAgent+=' fcm';require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
            echo "Firebase の設定を入れました(通知あり)"
          else
            echo "GOOGLE_SERVICES_JSON がないので、Android の通知なしで作ります"
          fi
      - run: npx cap sync android
      - name: APK を作る
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: staff-app-android
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx cap sync ios
      - name: シミュレーター用にビルドする(署名なし)
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
