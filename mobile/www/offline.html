<!doctype html>
<html lang="ja">
  <head>

    <style>

  </head>
  <body>
    <div class="card">
      <div class="logo" role="img" aria-label="Clerkly"><svg viewBox="5 5 82 90" aria-hidden="true"><path d="M80.64 24.29 A40 40 0 1 0 80.64 75.71 A5.5 5.5 0 0 0 72.22 68.64 A29 29 0 1 1 57.51 21.99" fill="none" stroke="#F7F8FA" stroke-width="6" stroke-linecap="round"/></svg></div>

      <p>電波やWi-Fiを確かめてから、もう一度開いてください。</p>
